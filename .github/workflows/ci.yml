name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clientes_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/clientes_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE clientes_test;'
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE clientes_e2e;'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Check migrations match schema
        run: pnpm --filter @cp/db exec drizzle-kit check
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @cp/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
